<!DOCTYPE html>
<html>
<head>
  <title>Feature Detector - Maps Tester</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
    #map { position: absolute; inset: 0; }
    #panel {
      position: absolute; top: 10px; left: 10px; z-index: 1000;
      background: rgba(255,255,255,0.96); padding: 12px 16px;
      border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      font-size: 13px; max-width: 340px;
    }
    #panel h3 { margin: 0 0 8px; font-size: 14px; }
    #panel button {
      background: #1a73e8; color: white; border: none;
      padding: 6px 12px; border-radius: 4px; cursor: pointer;
      font-size: 13px; margin-right: 6px;
    }
    #panel button:disabled { background: #aaa; cursor: default; }
    #panel input[type="text"], #panel input[type="number"] {
      width: 100%; box-sizing: border-box; margin-top: 4px;
      padding: 4px 6px; font-size: 12px;
      border: 1px solid #ccc; border-radius: 3px;
    }
    #panel .row { margin-top: 6px; }
    #panel .row label { display: block; font-size: 11px; color: #555; }
    #panel .radioRow { margin-top: 8px; }
    #panel .radioRow label { margin-right: 12px; font-size: 13px; }
    #status { margin-top: 8px; color: #555; font-size: 12px; }
    #coords { font-family: monospace; font-size: 12px; margin-top: 6px; }
    .fieldGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="panel">
    <h3>Feature Detector</h3>

    <div class="radioRow">
      <label><input type="radio" name="featureType" value="green" checked> Green</label>
      <label><input type="radio" name="featureType" value="bunker"> Bunker</label>
    </div>

    <div class="row">
      <label>Course name</label>
      <input id="courseName" type="text" value="Test Course">
    </div>

    <div class="fieldGrid">
      <div class="row">
        <label>Hole</label>
        <input id="holeNumber" type="number" value="1" min="1" max="18">
      </div>
      <div class="row">
        <label>Feature #</label>
        <input id="featureNumber" type="number" value="1" min="1">
      </div>
    </div>

    <div class="row" style="margin-top: 10px;">
      Right-click a feature to detect it
    </div>

    <div class="row" style="margin-top: 10px;">
      <button id="resetBtn" disabled>Reset</button>
      <button id="exportBtn" disabled>Export SVG</button>
    </div>

    <div id="coords">Seed: -</div>
    <div id="status">Loading OpenCV...</div>
  </div>

  <script>
    window.__opencvReady = false;
    window.__opencvCallbacks = [];
    var Module = {
      onRuntimeInitialized: function () {
        window.__opencvReady = true;
        window.__opencvCallbacks.forEach(function (fn) { fn(); });
        window.__opencvCallbacks = [];
      }
    };
  </script>
  <script src="./opencv.js"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

  <script type="module">
    import { detectFeature } from "./detector.bundle.js?v=1";

    const DEFAULT_CENTER = { lat: 56.3428, lng: -2.8026 }; // St Andrews
    const DEFAULT_ZOOM = 19;
    const MIN_VERTEX_DISTANCE = 15;

    let map;
    let polygonOverlay = null;
    let vertexMarkers = [];
    let editablePolygon = null;
    let lastSeed = null;

    function whenOpenCvReady() {
      return new Promise((resolve) => {
        if (window.__opencvReady) return resolve();
        window.__opencvCallbacks.push(resolve);
      });
    }

    function initMap() {
      map = new google.maps.Map(document.getElementById("map"), {
        center: DEFAULT_CENTER,
        zoom: DEFAULT_ZOOM,
        mapTypeId: "satellite",
        tilt: 0,
        disableDefaultUI: true,
        zoomControl: true,
        disableDoubleClickZoom: true,
      });

      map.addListener("rightclick", (event) => {
        event.domEvent.preventDefault();
        const seed = { x: event.pixel.x, y: event.pixel.y };
        lastSeed = seed;
        document.getElementById("coords").textContent =
          "Seed: (" + seed.x + ", " + seed.y + ")";
        runDetection(seed);
      });

      whenOpenCvReady().then(() => {
        document.getElementById("status").textContent =
          "OpenCV ready - right-click a feature";
      });
    }

    function getFeatureType() {
      const el = document.querySelector('input[name="featureType"]:checked');
      return el ? el.value : "green";
    }

    async function runDetection(seed) {
      const status = document.getElementById("status");
      const resetBtn = document.getElementById("resetBtn");
      const exportBtn = document.getElementById("exportBtn");

      if (!window.__opencvReady) {
        status.textContent = "OpenCV not ready yet.";
        return;
      }

      status.textContent = "Capturing map...";

      try {
        const imageData = await captureMapCanvas();
        status.textContent = "Detecting...";

        const featureType = getFeatureType();
        const polygon = detectFeature(window.cv, imageData, seed, featureType);

        if (!polygon || polygon.length < 3) {
          status.textContent = "No feature found at that point";
          clearEditable();
          exportBtn.disabled = true;
          return;
        }

        drawPolygon(polygon);
        resetBtn.disabled = false;
        exportBtn.disabled = false;
        status.textContent = "Found " + polygon.length + " points (" + featureType + ")";
      } catch (err) {
        console.error(err);
        status.textContent = "Error: " + err.message;
      }
    }

    async function captureMapCanvas() {
      const mapDiv = document.getElementById("map");
      const canvas = await html2canvas(mapDiv, {
        useCORS: true, allowTaint: false,
        backgroundColor: null, logging: false, scale: 1,
      });
      const ctx = canvas.getContext("2d");
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      return { width: imageData.width, height: imageData.height, data: imageData.data };
    }

    // ---- World-space helpers ----
    function latLngToWorld(latLng) { return map.getProjection().fromLatLngToPoint(latLng); }
    function worldToLatLng(world) { return map.getProjection().fromPointToLatLng(world); }

    function pixelToWorld(pixel) {
      const topRight = map.getProjection().fromLatLngToPoint(map.getBounds().getNorthEast());
      const bottomLeft = map.getProjection().fromLatLngToPoint(map.getBounds().getSouthWest());
      const scale = Math.pow(2, map.getZoom());
      return new google.maps.Point(
        pixel.x / scale + bottomLeft.x,
        pixel.y / scale + topRight.y
      );
    }

    function worldToPixel(world) {
      const topRight = map.getProjection().fromLatLngToPoint(map.getBounds().getNorthEast());
      const bottomLeft = map.getProjection().fromLatLngToPoint(map.getBounds().getSouthWest());
      const scale = Math.pow(2, map.getZoom());
      return {
        x: Math.round((world.x - bottomLeft.x) * scale),
        y: Math.round((world.y - topRight.y) * scale),
      };
    }

    function drawPolygon(pixelPoints) {
      clearEditable();
      editablePolygon = pixelPoints.map(pixelToWorld);
      redrawEditable();
    }

    function clearEditable() {
      if (polygonOverlay) { polygonOverlay.setMap(null); polygonOverlay = null; }
      for (const m of vertexMarkers) m.setMap(null);
      vertexMarkers = [];
      editablePolygon = null;
    }

    function redrawEditable() {
      if (!editablePolygon || editablePolygon.length < 3) return;
      const latLngs = editablePolygon.map(worldToLatLng);
      if (polygonOverlay) polygonOverlay.setMap(null);

      const featureType = getFeatureType();
      const colour = featureType === "bunker" ? "#ffcc44" : "#00ff00";

      polygonOverlay = new google.maps.Polygon({
        paths: latLngs,
        strokeColor: colour, strokeOpacity: 1, strokeWeight: 3,
        fillColor: colour, fillOpacity: 0.15,
        map: map,
      });

      for (const m of vertexMarkers) m.setMap(null);
      vertexMarkers = [];

      editablePolygon.forEach((point, index) => {
        const marker = new google.maps.Marker({
          position: worldToLatLng(point), map: map, draggable: true,
          icon: {
            path: google.maps.SymbolPath.CIRCLE,
            scale: 7, fillColor: "#ff8800", fillOpacity: 1,
            strokeColor: "#ffffff", strokeWeight: 2,
          },
          zIndex: 1000,
        });

        marker.addListener("drag", (event) => {
          const newWorld = latLngToWorld(event.latLng);
          const n = editablePolygon.length;
          const np = worldToPixel(newWorld);
          const pp = worldToPixel(editablePolygon[(index - 1 + n) % n]);
          const npp = worldToPixel(editablePolygon[(index + 1) % n]);
          if (
            Math.hypot(np.x - pp.x, np.y - pp.y) < MIN_VERTEX_DISTANCE ||
            Math.hypot(np.x - npp.x, np.y - npp.y) < MIN_VERTEX_DISTANCE
          ) return;
          editablePolygon[index] = newWorld;
          polygonOverlay.setPaths(editablePolygon.map(worldToLatLng));
        });

        vertexMarkers.push(marker);
      });
    }

    function exportSvg() {
      if (!editablePolygon || editablePolygon.length < 3) return;
      const course = document.getElementById("courseName").value || "Unknown";
      const hole = parseInt(document.getElementById("holeNumber").value, 10) || 0;
      const num = parseInt(document.getElementById("featureNumber").value, 10) || 1;
      const type = getFeatureType();

      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      for (const p of editablePolygon) {
        if (p.x < minX) minX = p.x;
        if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
      }
      const pad = 0.00002;
      const vbX = minX - pad, vbY = minY - pad;
      const vbW = maxX - minX + pad * 2, vbH = maxY - minY + pad * 2;

      const r = (n) => Math.round(n * 1e8) / 1e8;
      const ptsAttr = editablePolygon.map(p => `${r(p.x)},${r(p.y)}`).join(" ");
      const esc = (s) => s.replace(/&/g, "&amp;").replace(/"/g, "&quot;")
                          .replace(/</g, "&lt;").replace(/>/g, "&gt;");

      const svg = `<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" viewBox="${r(vbX)} ${r(vbY)} ${r(vbW)} ${r(vbH)}" data-course="${esc(course)}" data-hole="${hole}" data-feature-type="${type}" data-feature-number="${num}" data-coordinate-space="world-web-mercator"><polygon points="${ptsAttr}" fill="none" stroke="black" stroke-width="0.000005" stroke-linejoin="round" /></svg>\n`;

      const blob = new Blob([svg], { type: "image/svg+xml" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `${esc(course).replace(/\s+/g, "-")}-hole${hole}-${type}-${num}.svg`;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    document.getElementById("resetBtn").addEventListener("click", () => {
      clearEditable();
      document.getElementById("resetBtn").disabled = true;
      document.getElementById("exportBtn").disabled = true;
      document.getElementById("coords").textContent = "Seed: -";
      document.getElementById("status").textContent = "Waiting for seed click";
    });
    document.getElementById("exportBtn").addEventListener("click", exportSvg);

    window.initMap = initMap;
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=PASTE_YOUR_KEY_HERE&callback=initMap"
    async defer
  ></script>
</body>
key=PASTE_YOUR_KEY_HERE
</html>
